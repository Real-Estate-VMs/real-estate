name: Testes

# Valida o código da parte de Big Data sempre que ele muda. Roda nos runners do GitHub
# (não na VM processing, que tem só 2 GB e já executa o pipeline dos dados).
# Os commits de dados do generator (data/**) não disparam este workflow.
on:
  push:
    paths:
      - "scripts/**"
      - "sql/**"
      - "notebooks/**"
      - "ansible/**"
      - "requirements*.txt"
      - ".github/workflows/testes.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "sql/**"
      - "notebooks/**"
      - "ansible/**"
      - "requirements*.txt"
  workflow_dispatch:

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dw-etl-modelo:
    name: Data Warehouse, ETL e modelo de ML
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: teste
      DW_DSN: host=localhost dbname=realestate user=postgres password=teste
      REPO_PATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependências
        run: |
          pip install -r requirements-bigdata.txt scikit-learn==1.5.2
          python -m py_compile scripts/*.py

      - name: Criar banco e usuário de leitura
        run: |
          psql -d postgres -c "CREATE DATABASE realestate"
          psql -d postgres -c "CREATE ROLE dw_leitura LOGIN PASSWORD 'teste'"

      - name: ETL (primeira carga)
        run: python scripts/etl.py

      - name: ETL de novo não pode duplicar nada
        run: |
          antes=$(psql -d realestate -Atc "SELECT count(*) FROM dw.fato_imovel")
          python scripts/etl.py | tee /tmp/etl2.log
          grep -q "Nenhum arquivo novo" /tmp/etl2.log
          depois=$(psql -d realestate -Atc "SELECT count(*) FROM dw.fato_imovel")
          echo "fato: $antes -> $depois"
          test "$antes" -gt 0 && test "$antes" = "$depois"

      - name: Integridade do esquema estrela
        run: |
          psql -d realestate -v ON_ERROR_STOP=1 <<'SQL'
          -- toda linha da fato tem dimensões
          SELECT count(*) AS sem_localizacao FROM dw.fato_imovel f
            LEFT JOIN dw.dim_localizacao l USING (sk_localizacao) WHERE l.sk_localizacao IS NULL \gset
          SELECT count(*) AS sem_carga FROM dw.fato_imovel f
            LEFT JOIN dw.etl_carga c ON c.id = f.id_carga WHERE c.id IS NULL \gset
          -- nenhum dado pessoal no DW (LGPD)
          SELECT count(*) AS colunas_pessoais FROM information_schema.columns
            WHERE table_schema = 'dw' AND column_name IN ('seller_name', 'buyer_id', 'buyer_notes') \gset
          SELECT (:sem_localizacao = 0 AND :sem_carga = 0 AND :colunas_pessoais = 0) AS ok \gset
          \if :ok
            \echo 'Integridade ok'
          \else
            \echo 'FALHOU' :sem_localizacao :sem_carga :colunas_pessoais
            SELECT 1/0;
          \endif
          -- views OLAP respondem
          SELECT count(*) FROM dw.vw_rollup_localizacao;
          SELECT count(*) FROM dw.vw_drilldown_tempo;
          SELECT count(*) FROM dw.vw_cubo_tipo_regiao;
          SQL

      - name: Modelo de preço grava as previsões
        run: |
          python scripts/ml_precos.py
          # imóveis sem alguma variável (ex.: quartos nulos) ficam sem previsão: ~1% da base
          resultado=$(psql -d realestate -Atc "
            SELECT CASE WHEN (SELECT count(*) FROM dw.previsao_preco) >= 0.9 * (SELECT count(*) FROM dw.fato_imovel)
                         AND (SELECT r2 FROM dw.modelo_metricas ORDER BY id DESC LIMIT 1) > 0.8
                        THEN 'modelo ok' ELSE 'FALHOU' END")
          echo "$resultado"
          test "$resultado" = "modelo ok"

  notebook:
    name: Notebook executa do início ao fim
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODO_NOTEBOOK: github
      REPO_LOCAL: ${{ github.workspace }}   # usa os dados do commit testado, sem depender da rede
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependências
        run: pip install -r requirements-notebook.txt

      - name: Executar o notebook
        run: |
          jupyter nbconvert --to notebook --execute --ExecutePreprocessor.timeout=1500 \
            --output /tmp/executado.ipynb notebooks/PI_BigData.ipynb

      - name: Conferir resultados
        run: |
          python - <<'PY'
          import nbformat
          nb = nbformat.read("/tmp/executado.ipynb", as_version=4)
          texto = "\n".join(
              o.get("text", "") + o.get("data", {}).get("text/plain", "")
              for c in nb.cells if c.cell_type == "code" for o in c.outputs
          )
          assert "MapReduce == DataFrame Spark: True" in texto, "MapReduce difere do DataFrame"
          assert "Spark == pandas/DW          : True" in texto, "Spark difere do DW"
          assert "Modo de execução: github" in texto
          print("Notebook ok:", sum(c.cell_type == "code" for c in nb.cells), "células de código")
          PY

  validar-estatico:
    name: Playbooks, scripts e dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sintaxe dos playbooks do Ansible
        run: |
          pip install ansible-core==2.17.7
          ansible-galaxy collection install community.postgresql community.general
          for p in ansible/playbooks/*.yml; do
            ANSIBLE_CONFIG=ansible/ansible.cfg ansible-playbook --syntax-check -i ansible/inventory.example.ini "$p"
          done

      - name: Scripts shell e JSON do Grafana
        run: |
          for f in setup.sh scripts/*.sh; do bash -n "$f" && echo "ok $f"; done
          for f in ansible/templates/*.json; do python -m json.tool "$f" > /dev/null && echo "ok $f"; done
