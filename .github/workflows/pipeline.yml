name: Real Estate Pipeline

on:
  push:
    paths:
      - "data/raw/*.csv"

jobs:
  process:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for added CSV files
        id: check
        run: |
          added=$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- 'data/raw/*.csv' | head -1)
          if [ -z "$added" ]; then
            echo "No CSV files added — skipping pipeline."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "CSV encontrado: $added"
            echo "file=$added" >> $GITHUB_OUTPUT
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Process CSV with R
        if: steps.check.outputs.skip == 'false'
        run: |
          Rscript scripts/processing.R "${{ github.workspace }}/${{ steps.check.outputs.file }}"

      - name: Commit and push parquet
        if: steps.check.outputs.skip == 'false'
        run: |
          base=$(basename "${{ steps.check.outputs.file }}" .csv)
          git config user.name "processing-vm"
          git config user.email "processing@real-estate"
          git add "data/processed/${base}_clean.parquet"
          git commit -m "processed: add ${base}_clean.parquet"
          git push
