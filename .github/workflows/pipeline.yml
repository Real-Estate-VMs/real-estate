name: Real Estate Pipeline

on:
  push:
    paths:
      - "data/raw/*.csv"

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for added CSV files
        id: check
        run: |
          added=$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- 'data/raw/*.csv')
          if [ -z "$added" ]; then
            echo "No CSV files added — skipping pipeline."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Added files: $added"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Trigger processing on R VM
        if: steps.check.outputs.skip == 'false'
        # TODO: SSH into processing VM and run the R script
        # Requires PROCESSING_VM_IP secret when VM is deployed
        run: |
          echo "New CSV detected in data/raw/"
          echo "Pending: configure SSH access to processing VM"
