---
- name: Configure generator VM
  hosts: generator
  become: true

  vars:
    devops_home: /home/devops
    repo_path: /home/devops/repo
    # URL sem token: a credencial fica só em ~/.git-credentials (modo 0600).
    repo_url: "https://github.com/Real-Estate-VMs/real-estate.git"

  tasks:
    - name: Require GitHub token
      assert:
        that:
          - github_token | default('') | length > 0
        fail_msg: "github_token é obrigatório e não pode ser vazio."
      no_log: true

    - name: Check devops home
      stat:
        path: "{{ devops_home }}"
      register: devops_home_stat

    - name: Fail when devops home is missing
      fail:
        msg: "Diretório {{ devops_home }} não existe. A VM precisa do usuário devops criado pelo cloud-init."
      when: not devops_home_stat.stat.exists or not devops_home_stat.stat.isdir

    - name: Force apt to use IPv4
      copy:
        content: 'Acquire::ForceIPv4 "true";'
        dest: /etc/apt/apt.conf.d/99force-ipv4
        owner: root
        group: root
        mode: "0644"

    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600
      register: apt_cache
      retries: 3
      delay: 15
      until: apt_cache is succeeded

    - name: Install dependencies
      apt:
        name:
          - python3
          - python3-dotenv
          - git
        state: present
      register: apt_packages
      retries: 3
      delay: 15
      until: apt_packages is succeeded

    # O GitHub redireciona a URL e o git descarta o token embutido nela, fazendo o
    # push falhar com "could not read Username". A credencial fica no helper e o
    # remote usa a URL limpa — inclusive num clone antigo que ainda tenha o token.
    - name: Store GitHub credentials for git
      copy:
        dest: "{{ devops_home }}/.git-credentials"
        content: "https://x-access-token:{{ github_token }}@github.com\n"
        owner: devops
        group: devops
        mode: "0600"
      no_log: true

    - name: Configure git identity and credential helper
      git_config:
        name: "{{ item.name }}"
        scope: global
        value: "{{ item.value }}"
      loop:
        - { name: user.name, value: generator-vm }
        - { name: user.email, value: generator@real-estate }
        - { name: credential.helper, value: store }
      become_user: devops
      environment:
        HOME: "{{ devops_home }}"

    - name: Clone or pull repository
      git:
        repo: "{{ repo_url }}"
        dest: "{{ repo_path }}"
        version: main
        update: true
      become_user: devops
      environment:
        HOME: "{{ devops_home }}"
      register: repo_sync
      retries: 3
      delay: 10
      until: repo_sync is succeeded
      notify: Restart generator

    - name: Use clean git remote URL (no token)
      git_config:
        name: remote.origin.url
        repo: "{{ repo_path }}"
        scope: local
        value: "{{ repo_url }}"
      become_user: devops
      environment:
        HOME: "{{ devops_home }}"

    - name: Create data/raw directory
      file:
        path: "{{ devops_home }}/data/raw"
        state: directory
        owner: devops
        group: devops
        mode: "0755"

    - name: Deploy .env file
      template:
        src: ../templates/generator.env.j2
        dest: "{{ repo_path }}/.env"
        owner: devops
        group: devops
        mode: "0600"
      no_log: true
      notify: Restart generator

    - name: Deploy systemd service
      template:
        src: ../templates/generator.service.j2
        dest: /etc/systemd/system/generator.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart generator

    - name: Enable and start generator service
      systemd:
        name: generator
        enabled: true
        state: started
        daemon_reload: true

    - name: Apply generator changes before remaining tasks
      meta: flush_handlers

    - name: Install Node Exporter
      apt:
        name: prometheus-node-exporter
        state: present
      register: apt_node_exporter
      retries: 3
      delay: 15
      until: apt_node_exporter is succeeded

    - name: Enable and start Node Exporter
      systemd:
        name: prometheus-node-exporter
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Restart generator
      systemd:
        name: generator
        state: restarted
        daemon_reload: true
