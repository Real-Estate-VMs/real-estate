---
- name: Configure generator VM
  hosts: generator
  become: true

  vars:
    devops_home: /home/devops
    repo_path: /home/devops/repo
    repo_url: "https://{{ github_token }}@github.com/Real-Estate-VMs/real-estate.git"

  tasks:
    - name: Force apt to use IPv4
      copy:
        content: 'Acquire::ForceIPv4 "true";'
        dest: /etc/apt/apt.conf.d/99force-ipv4

    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install dependencies
      apt:
        name:
          - python3
          - python3-dotenv
          - git
        state: present

    - name: Clone or pull repository
      git:
        repo: "{{ repo_url }}"
        dest: "{{ repo_path }}"
        version: main
        update: true
      become_user: devops

    # O GitHub redireciona a URL e o git descarta o token embutido nela, fazendo o
    # push falhar com "could not read Username". Por isso a credencial fica no
    # credential helper (vale para o host) e o remote usa uma URL limpa.
    - name: Store GitHub credentials for git
      shell: |
        git config --global credential.helper store
        umask 077
        printf 'https://x-access-token:%s@github.com\n' '{{ github_token }}' > ~/.git-credentials
      become_user: devops
      changed_when: false
      no_log: true

    - name: Use clean git remote URL (no token)
      command: git remote set-url origin https://github.com/Real-Estate-VMs/real-estate.git
      args:
        chdir: "{{ repo_path }}"
      become_user: devops
      changed_when: false

    - name: Configure git identity
      shell: |
        git config --global user.name "generator-vm"
        git config --global user.email "generator@real-estate"
      become_user: devops

    - name: Create data/raw directory
      file:
        path: "{{ devops_home }}/data/raw"
        state: directory
        owner: devops
        group: devops
        mode: "0755"

    - name: Deploy .env file
      template:
        src: ../templates/generator.env.j2
        dest: "{{ repo_path }}/.env"
        owner: devops
        group: devops
        mode: "0600"

    - name: Deploy systemd service
      template:
        src: ../templates/generator.service.j2
        dest: /etc/systemd/system/generator.service
        mode: "0644"

    - name: Enable and start generator service
      systemd:
        name: generator
        enabled: true
        state: started
        daemon_reload: true

    - name: Restart generator service to pick up latest code
      systemd:
        name: generator
        state: restarted

    - name: Install Node Exporter
      apt:
        name: prometheus-node-exporter
        state: present

    - name: Enable and start Node Exporter
      systemd:
        name: prometheus-node-exporter
        enabled: true
        state: started
