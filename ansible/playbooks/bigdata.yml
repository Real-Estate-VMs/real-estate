---
- name: Configure bigdata VM
  hosts: bigdata
  become: true

  vars:
    devops_home: /home/devops
    repo_path: /home/devops/repo            # clone usado só pelo ETL (somente leitura)
    workspace_path: /home/devops/workspace  # clone do Jupyter, onde o grupo pode editar
    venv_path: /home/devops/venv
    requirements_dir: /home/devops/requirements
    pg_version: "16"
    dw_database: realestate
    # Rede das VMs (libvirt default): o Grafana na VM monitoring lê o DW por aqui
    dw_allowed_network: 192.168.122.0/24

  tasks:
    - name: Force apt to use IPv4
      copy:
        content: 'Acquire::ForceIPv4 "true";'
        dest: /etc/apt/apt.conf.d/99force-ipv4

    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install PostgreSQL, Python and tools
      apt:
        name:
          - postgresql
          - openjdk-17-jre-headless
          - python3-venv
          - python3-psycopg2
          - git
          - acl
          - prometheus-node-exporter
        state: present

    - name: Enable and start Node Exporter
      systemd:
        name: prometheus-node-exporter
        enabled: true
        state: started

    # ── PostgreSQL (Data Warehouse) ───────────────────────────────────────────
    - name: Listen on all interfaces
      community.postgresql.postgresql_set:
        name: listen_addresses
        value: "*"
      become_user: postgres
      notify: restart postgresql

    - name: Allow read-only access from the VM network
      community.postgresql.postgresql_pg_hba:
        dest: "/etc/postgresql/{{ pg_version }}/main/pg_hba.conf"
        contype: host
        databases: "{{ dw_database }}"
        users: dw_leitura
        source: "{{ dw_allowed_network }}"
        method: scram-sha-256
      notify: reload postgresql

    - name: Start PostgreSQL
      systemd:
        name: postgresql
        enabled: true
        state: started

    - name: Create ETL role (peer auth for the devops OS user)
      community.postgresql.postgresql_user:
        name: devops
      become_user: postgres

    - name: Create read-only role for Grafana and the notebook
      community.postgresql.postgresql_user:
        name: dw_leitura
        password: "{{ dw_reader_password }}"
      become_user: postgres
      no_log: true

    - name: Create Data Warehouse database
      community.postgresql.postgresql_db:
        name: "{{ dw_database }}"
        owner: devops
      become_user: postgres

    # ── Código e ambiente Python ──────────────────────────────────────────────
    # O repositório é público e esta VM só lê: clone sem token.
    - name: Clone or pull repository
      git:
        repo: https://github.com/Real-Estate-VMs/real-estate.git
        dest: "{{ repo_path }}"
        version: main
        update: true
      become_user: devops

    - name: Clone workspace for Jupyter (only if missing, never overwrites edits)
      git:
        repo: https://github.com/Real-Estate-VMs/real-estate.git
        dest: "{{ workspace_path }}"
        version: main
        update: false
      become_user: devops

    - name: Create requirements directory
      file:
        path: "{{ requirements_dir }}"
        state: directory
        owner: devops
        group: devops
        mode: "0755"

    - name: Copy requirements files
      copy:
        src: "../../{{ item }}"
        dest: "{{ requirements_dir }}/{{ item }}"
        owner: devops
        group: devops
        mode: "0644"
      loop:
        - requirements-bigdata.txt
        - requirements-notebook.txt

    - name: Create Python virtualenv (ETL, notebook, Spark and Jupyter)
      pip:
        requirements: "{{ requirements_dir }}/requirements-notebook.txt"
        virtualenv: "{{ venv_path }}"
        virtualenv_command: python3 -m venv
      become_user: devops

    # Passo 2 das instruções do PDF da disciplina (integração Colab + Linux)
    - name: Enable jupyter_http_over_ws extension
      command: "{{ venv_path }}/bin/jupyter serverextension enable --py jupyter_http_over_ws"
      become_user: devops
      changed_when: false

    - name: Deploy Jupyter service
      template:
        src: ../templates/jupyter.service.j2
        dest: /etc/systemd/system/jupyter.service
        mode: "0640"
      no_log: true
      notify: restart jupyter

    - name: Enable and start Jupyter
      systemd:
        name: jupyter
        enabled: true
        state: started
        daemon_reload: true

    # ── ETL agendado ──────────────────────────────────────────────────────────
    - name: Deploy ETL and ML services and timers
      template:
        src: "../templates/{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        mode: "0644"
      loop:
        - etl.service
        - etl.timer
        - ml.service
        - ml.timer

    - name: Enable ETL and ML timers
      systemd:
        name: "{{ item }}"
        enabled: true
        state: started
        daemon_reload: true
      loop:
        - etl.timer
        - ml.timer

    - name: Flush handlers before the first load
      meta: flush_handlers

    - name: Run ETL once now
      systemd:
        name: etl.service
        state: started

    # Primeiro treino logo após a carga; depois o timer repete todo dia às 03:30
    - name: Train the price model once now
      systemd:
        name: ml.service
        state: started

  handlers:
    - name: restart jupyter
      systemd:
        name: jupyter
        state: restarted
        daemon_reload: true

    - name: restart postgresql
      systemd:
        name: postgresql
        state: restarted

    - name: reload postgresql
      systemd:
        name: postgresql
        state: reloaded
