---
- name: Configure processing VM
  hosts: processing
  become: true

  vars:
    devops_home: /home/devops
    runner_version: "2.338.2"
    repo_path: /home/devops/repo
    repo_url: "https://{{ github_token }}@github.com/Real-Estate-VMs/real-estate.git"

  tasks:
    - name: Force apt to use IPv4
      copy:
        content: 'Acquire::ForceIPv4 "true";'
        dest: /etc/apt/apt.conf.d/99force-ipv4

    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install R and dependencies
      apt:
        name:
          - r-base
          - r-base-dev
          - git
          - libcurl4-openssl-dev
          - libssl-dev
          - libxml2-dev
        state: present

    - name: Install R packages
      command: >
        Rscript -e "install.packages(c('arrow', 'dplyr', 'readr', 'stringr'), repos='https://cloud.r-project.org')"
      args:
        creates: /etc/r-packages-installed

    - name: Mark R packages as installed
      file:
        path: /etc/r-packages-installed
        state: touch

    - name: Clone or pull repository
      git:
        repo: "{{ repo_url }}"
        dest: "{{ repo_path }}"
        version: main
        update: true
      become_user: devops

    # O GitHub redireciona a URL e o git descarta o token embutido nela, fazendo o
    # push falhar com "could not read Username". Por isso a credencial fica no
    # credential helper (vale para o host) e o remote usa uma URL limpa.
    - name: Store GitHub credentials for git
      shell: |
        git config --global credential.helper store
        umask 077
        printf 'https://x-access-token:%s@github.com\n' '{{ github_token }}' > ~/.git-credentials
      become_user: devops
      changed_when: false
      no_log: true

    - name: Use clean git remote URL (no token)
      command: git remote set-url origin https://github.com/Real-Estate-VMs/real-estate.git
      args:
        chdir: "{{ repo_path }}"
      become_user: devops
      changed_when: false

    - name: Configure git identity
      shell: |
        git config --global user.name "processing-vm"
        git config --global user.email "processing@real-estate"
      become_user: devops

    - name: Create data/processed directory
      file:
        path: "{{ devops_home }}/data/processed"
        state: directory
        owner: devops
        group: devops
        mode: "0755"

    - name: Install Node Exporter
      apt:
        name: prometheus-node-exporter
        state: present

    - name: Enable and start Node Exporter
      systemd:
        name: prometheus-node-exporter
        enabled: true
        state: started

    - name: Create Actions runner directory
      file:
        path: "{{ devops_home }}/actions-runner"
        state: directory
        owner: devops
        group: devops
        mode: "0755"

    - name: Download Actions runner
      get_url:
        url: "https://github.com/actions/runner/releases/download/v{{ runner_version }}/actions-runner-linux-x64-{{ runner_version }}.tar.gz"
        dest: "/tmp/actions-runner-{{ runner_version }}.tar.gz"
        mode: "0644"

    - name: Extract Actions runner
      unarchive:
        src: "/tmp/actions-runner-{{ runner_version }}.tar.gz"
        dest: "{{ devops_home }}/actions-runner/"
        remote_src: true
        owner: devops
        group: devops
        creates: "{{ devops_home }}/actions-runner/.extracted-{{ runner_version }}"
      register: runner_extract

    - name: Mark runner version as extracted
      file:
        path: "{{ devops_home }}/actions-runner/.extracted-{{ runner_version }}"
        state: touch
        owner: devops
        group: devops
        mode: "0644"
      when: runner_extract is changed

    - name: Get runner registration token
      uri:
        url: https://api.github.com/repos/Real-Estate-VMs/real-estate/actions/runners/registration-token
        method: POST
        headers:
          Authorization: "Bearer {{ github_token }}"
          Accept: application/vnd.github+json
        status_code: 201
      register: runner_reg

    - name: Configure Actions runner
      shell: |
        ./config.sh \
          --url https://github.com/Real-Estate-VMs/real-estate \
          --token {{ runner_reg.json.token }} \
          --name processing-vm \
          --replace \
          --labels self-hosted \
          --unattended
      args:
        chdir: "{{ devops_home }}/actions-runner"
        creates: "{{ devops_home }}/actions-runner/.runner"
      become_user: devops

    - name: Install Actions runner as service
      shell: ./svc.sh install devops
      args:
        chdir: "{{ devops_home }}/actions-runner"
      ignore_errors: true

    - name: Start Actions runner service
      shell: ./svc.sh start
      args:
        chdir: "{{ devops_home }}/actions-runner"
      ignore_errors: true
